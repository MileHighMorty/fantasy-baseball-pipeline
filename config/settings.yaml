league:
  name: "Dynasty League"
  platform: fantrax
  teams: 12
  format: dynasty
  scoring: h2h_categories
  roster:
    C: 1
    1B: 1
    2B: 1
    3B: 1
    SS: 1
    OF: 5
    UTIL: 2
    SP: 5
    RP: 3
    BN: 5
    IL: 3
    MiLB: 5
  hitting_categories:
    - R
    - HR
    - RBI
    - SB
    - OBP
  pitching_categories:
    - W
    - K
    - ERA
    - WHIP
    - SVH

fantrax:
  # Two identifiers for the same team, because the two bronze feeds name it
  # differently: the manual Players-page export's Status column carries the
  # owner label (my_team_label, used by fantrax_csv_import), while the live
  # API returns the fantasy team name (my_team_name, used by fantrax_client).
  my_team_label: "Matt"
  my_team_name: "Rutsch Hour"
  league_id: "l20m69v3mgdwwo4u"

data:
  bronze_path: bronze/data
  silver_path: silver/data
  gold_path: gold/data

refresh:
  daily_hour: 6
  weekly_day: Monday
